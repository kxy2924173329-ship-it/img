<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020818">
<title>环天星座 · 卫星展示</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #020818; color: #e6f4ff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
  }
  body { background: radial-gradient(ellipse at center, #06204a 0%, #020818 70%); }

  .view {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    visibility: hidden; z-index: 0;
  }
  .view.active { visibility: visible; z-index: 2; }
  .view.leaving { visibility: visible; z-index: 1; pointer-events: none; }

  /* 16:9 画面：横屏时按屏幕等比铺满；竖屏时整体旋转 90° 铺满 */
  .stage {
    --rot: 0deg;
    position: relative; flex: none;
    width: min(100vw, calc(100vh * 16 / 9));
    width: min(100vw, calc(100dvh * 16 / 9));
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    --ox: 50%; --oy: 50%; --zx: 0%; --zy: 0%;
    transform: rotate(var(--rot));
  }
  @media (orientation: portrait) {
    .stage {
      --rot: 90deg;
      width: min(100vh, calc(100vw * 16 / 9));
      width: min(100dvh, calc(100vw * 16 / 9));
    }
  }
  .stage img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; user-select: none; -webkit-user-drag: none;
  }
  .fx {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  /* 首页卫星标签：柔和光晕 + 扫光 */
  .hot {
    position: absolute; display: block; border: 0; padding: 0; margin: 0;
    background: transparent; cursor: pointer;
    border-radius: 6px; border-radius: .47cqw;
    outline: none;
  }
  .hot::after {
    content: ""; position: absolute; inset: 0;
    border-radius: 8px; border-radius: .6cqw;
    pointer-events: none;
    border: 6px solid rgba(80, 190, 255, .55);
    border-width: .45cqw;
    filter: blur(12px); filter: blur(.9cqw);
    mix-blend-mode: screen;
    opacity: 0;
    animation: glow 2.8s ease-in-out infinite;
  }
  .hot::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; z-index: 1;
    background: linear-gradient(105deg,
      rgba(255, 255, 255, 0) 34%,
      rgba(130, 210, 255, .14) 44%,
      rgba(210, 240, 255, .38) 50%,
      rgba(130, 210, 255, .14) 56%,
      rgba(255, 255, 255, 0) 66%) no-repeat;
    background-size: 260% 100%;
    background-position: 160% 0;
    mix-blend-mode: screen;
    animation: sweep 2.8s ease-in-out infinite;
  }
  .hot.radar::after, .hot.radar::before { animation-delay: 1.4s; }
  .hot:active::after, .hot:focus-visible::after {
    animation: none; opacity: 1;
    border-color: rgba(110, 210, 255, .8);
  }
  @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes sweep { 0% { background-position: 160% 0; } 55%, 100% { background-position: -60% 0; } }

  /* 详情页返回键：放在画面左下角的空白处，属于画面的一部分 */
  .back {
    position: absolute; z-index: 5;
    left: 2.2cqw; bottom: 3.2cqw;
    display: flex; align-items: center; gap: .45em;
    font: inherit; font-size: 1.45cqw; font-size: max(1.45cqw, 14px); font-weight: 600; letter-spacing: .18em;
    color: #d8f1ff;
    padding: .62em 1.25em .62em 1em;
    border: 0; cursor: pointer;
    background: linear-gradient(135deg, #5fd4ff, #1d7dff 55%, #46c3ff);
    clip-path: polygon(0 0, calc(100% - .8em) 0, 100% .8em, 100% 100%, .8em 100%, 0 calc(100% - .8em));
    filter: drop-shadow(0 0 .5em rgba(40, 150, 255, .55));
    transition: transform .15s ease;
  }
  .back::before {
    content: ""; position: absolute; inset: .11em; z-index: -1;
    background: linear-gradient(180deg, rgba(10, 40, 95, .96), rgba(4, 22, 60, .96));
    clip-path: inherit;
  }
  .back { isolation: isolate; }
  .back svg { width: .9em; height: .9em; flex: none; }
  .back:active { transform: scale(.95); }
  .back:active::before { background: linear-gradient(180deg, rgba(25, 80, 170, .96), rgba(10, 45, 110, .96)); }

  /* ---------- 页面切换动效 ---------- */
  /* 首页 → 详情：首页朝点击的卫星标签推进放大、变亮淡出 */
  .view.leaving.from-home .stage { animation: homeOut .55s ease-in forwards; }
  @keyframes homeOut {
    0%   { transform: rotate(var(--rot)) translate(0, 0) scale(1); opacity: 1; filter: brightness(1); }
    100% { transform: rotate(var(--rot)) translate(var(--zx), var(--zy)) scale(1.1); opacity: 0; filter: brightness(1.12); }
  }
  /* 详情页从点击位置以光圈形式展开 */
  .view.entering.from-home .stage { animation: detailIn .6s ease-out .15s both; }
  @keyframes detailIn {
    from { transform: rotate(var(--rot)) scale(1.04); opacity: 0; filter: brightness(1.12); }
    to   { transform: rotate(var(--rot)) scale(1); opacity: 1; filter: brightness(1); }
  }
  .burst {
    position: absolute; left: var(--ox); top: var(--oy); z-index: 4;
    width: 10cqw; height: 10cqw; margin: -5cqw 0 0 -5cqw; border-radius: 50%;
    background: radial-gradient(circle, rgba(140, 220, 255, 0) 56%, rgba(150, 225, 255, .55) 66%, rgba(90, 190, 255, .18) 72%, rgba(90, 190, 255, 0) 80%);
    pointer-events: none; opacity: 0; transform: scale(0);
  }
  
  @keyframes burst {
    0% { transform: scale(0); opacity: 1; }
    70% { opacity: .8; }
    100% { transform: scale(24); opacity: 0; }
  }
  /* 展开后一道扫描光从上到下扫过画面 */
  .scanbar {
    position: absolute; left: 0; right: 0; top: 0; height: 16%; z-index: 4;
    pointer-events: none; opacity: 0;
    background: linear-gradient(to bottom, rgba(110, 210, 255, 0), rgba(110, 210, 255, .07) 65%, rgba(190, 240, 255, .16) 97%, rgba(110, 210, 255, 0));
    mix-blend-mode: screen;
  }
  .view.entering.from-home .scanbar { animation: scan 1.1s ease-in-out .55s both; }
  @keyframes scan {
    0% { transform: translateY(-100%); opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(625%); opacity: 0; }
  }
  .view.entering.from-home .back { animation: backIn .4s ease-out .6s both; }
  @keyframes backIn { from { opacity: 0; translate: -1.5cqw 0; } to { opacity: 1; translate: 0 0; } }

  /* 详情 → 首页：详情页缩小淡出，首页从推近状态拉回 */
  .view.leaving.to-home .stage { animation: detailOut .4s ease-in forwards; }
  @keyframes detailOut {
    to { transform: rotate(var(--rot)) scale(.97); opacity: 0; }
  }
  .view.entering.to-home .stage { animation: homeIn .55s ease-out .08s both; }
  .view.entering.intro .stage { animation: homeIn 1.1s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes homeIn {
    from { transform: rotate(var(--rot)) scale(1.05); opacity: 0; }
    to   { transform: rotate(var(--rot)) scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .view .stage, .view .burst, .view .scanbar, .view .back { animation: none !important; }
    .hot::after, .hot::before { animation: none; }
  }
</style>
</head>
<body>

<section class="view" id="home" aria-label="星座总览">
  <div class="stage" id="homeStage">
    <img src="home.jpg" srcset="home-1920.jpg 1920w, home.jpg 2560w, home-3840.jpg 3840w"
         sizes="(orientation: portrait) 100vh, (min-aspect-ratio: 16/9) calc(100vh * 16 / 9), 100vw"

<section class="view" id="optical" aria-label="光学卫星">
  <div class="stage">
    <img src="optical.jpg" srcset="optical-1920.jpg 1920w, optical.jpg 2560w, optical-3840.jpg 3840w"
         sizes="(orientation: portrait) 100vh, (min-aspect-ratio: 16/9) calc(100vh * 16 / 9), 100vw"
         alt="一期二阶段 光学卫星参数" decoding="async">
    <canvas class="fx" data-scene="optical" aria-hidden="true"></canvas>

    </button>

<section class="view" id="radar" aria-label="雷达卫星">
  <div class="stage">
    <img src="radar.jpg" srcset="radar-1920.jpg 1920w, radar.jpg 2560w, radar-3840.jpg 3840w"
         sizes="(orientation: portrait) 100vh, (min-aspect-ratio: 16/9) calc(100vh * 16 / 9), 100vw"
         alt="一期二阶段 雷达卫星参数" decoding="async">
    <canvas class="fx" data-scene="radar" aria-hidden="true"></canvas>
    <div class="burst" aria-hidden="true"></div>
    <div class="scanbar" aria-hidden="true"></div>
    <button class="back" data-go="home" aria-label="返回总览">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5 5 8l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>返回
    </button>
  </div>

<script>
(function () {
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAU = Math.PI * 2;
  // 所有坐标以 2576×1449 为基准，随画面等比缩放
  var BW = 2576, BH = 1449;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function inRect(x, y, r, pad) { pad = pad || 0; return x > r[0] - pad && x < r[2] + pad && y > r[1] - pad && y < r[3] + pad; }
  function glow(c, x, y, r, a, rgb) {
    if (a <= 0 || r <= 0) return;
    var g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(" + rgb + "," + a + ")");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  function ellipseGlow(c, x, y, rx, ry, rot, a, rgb) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, ry / rx);
    glow(c, 0, 0, rx, a, rgb); c.restore();
  }
  function points(n, accept) {
    var out = [], guard = 0;
    while (out.length < n && guard++ < n * 200) {
      var x = rand(0, BW), y = rand(0, BH);
      if (accept(x, y)) out.push({ x: x, y: y, r: rand(1.2, 3.2), p: rand(0, TAU), s: rand(0.6, 1.8) });
    }
    return out;
  }
  function twinkle(c, list, rgb, maxA, size) {
    for (var i = 0; i < list.length; i++) {
      var st = list[i];
      var k = 0.5 + 0.5 * Math.sin(T * st.s + st.p);
      glow(c, st.x, st.y, st.r * (size || 3.2), 0.06 + maxA * k * k, rgb);
    }
  }
  // 流星
  function Meteors(area, gap) {
    this.list = []; this.next = rand(1, 2.5); this.area = area; this.gap = gap;
  }
  Meteors.prototype.draw = function (c, dt) {
    this.next -= dt;
    if (this.next <= 0) {
      var a = this.area[Math.floor(Math.random() * this.area.length)];
      this.list.push({ x: rand(a[0], a[2]), y: rand(a[1], a[3]), vx: rand(-620, -400), vy: rand(240, 360), life: 0, max: rand(1, 1.6), w: rand(2, 3.5) });
      this.next = rand(this.gap[0], this.gap[1]);
    }
    for (var m = this.list.length - 1; m >= 0; m--) {
      var mt = this.list[m];
      mt.life += dt;
      if (mt.life > mt.max) { this.list.splice(m, 1); continue; }
      var hx = mt.x + mt.vx * mt.life, hy = mt.y + mt.vy * mt.life;
      var fade = Math.sin(Math.PI * mt.life / mt.max);
      var tx = hx - mt.vx * 0.32, ty = hy - mt.vy * 0.32;
      var lg = c.createLinearGradient(hx, hy, tx, ty);
      lg.addColorStop(0, "rgba(230,245,255," + (0.7 * fade) + ")");
      lg.addColorStop(1, "rgba(80,170,255,0)");
      c.strokeStyle = lg; c.lineWidth = mt.w; c.lineCap = "round";
      c.beginPath(); c.moveTo(hx, hy); c.lineTo(tx, ty); c.stroke();
      glow(c, hx, hy, 9, 0.5 * fade, "220,240,255");
    }
  };
  // 缓慢漂移的星尘
  function Dust(n, skip, vx, vy) {
    this.list = [];
    for (var i = 0; i < n; i++) this.list.push({ x: rand(0, BW), y: rand(0, BH), r: rand(1, 2.4), a: rand(0.15, 0.4), k: rand(0.5, 1.4), p: rand(0, TAU) });
    this.skip = skip; this.vx = vx; this.vy = vy;
  }
  Dust.prototype.draw = function (c, dt) {
    c.fillStyle = "rgb(190,225,255)";
    for (var i = 0; i < this.list.length; i++) {
      var d = this.list[i];
      d.x += this.vx * d.k * dt; d.y += this.vy * d.k * dt;
      if (d.x > BW + 10) d.x = -10; if (d.x < -10) d.x = BW + 10;
      if (d.y > BH + 10) d.y = -10; if (d.y < -10) d.y = BH + 10;
      if (this.skip(d.x, d.y)) continue;
      c.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(T * 1.5 * d.k + d.p));
      c.beginPath(); c.arc(d.x, d.y, d.r, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  };
  // 沿面板边框跑动的光点
  function framePath(r, k) {
    var x0 = r[0], y0 = r[1], x1 = r[2], y1 = r[3];
    var pts = [[x0 + k, y0], [x1 - k, y0], [x1, y0 + k], [x1, y1 - k], [x1 - k, y1], [x0 + k, y1], [x0, y1 - k], [x0, y0 + k], [x0 + k, y0]];
    var segs = [], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1], L = Math.sqrt(dx * dx + dy * dy);
      segs.push({ x: pts[i][0], y: pts[i][1], dx: dx, dy: dy, L: L }); total += L;
    }
    return { segs: segs, total: total };
  }
  function pathPoint(fp, d) {
    d = ((d % fp.total) + fp.total) % fp.total;
    for (var i = 0; i < fp.segs.length; i++) {
      var s = fp.segs[i];
      if (d <= s.L) return { x: s.x + s.dx * d / s.L, y: s.y + s.dy * d / s.L };
      d -= s.L;
    }
    return { x: fp.segs[0].x, y: fp.segs[0].y };
  }
  function runLights(c, fp, speed, offsets) {
    for (var o = 0; o < offsets.length; o++) {
      var head = T * speed + offsets[o] * fp.total;
      for (var q = 18; q >= 0; q--) {
        var p = pathPoint(fp, head - q * 9);
        var f = 1 - q / 18;
        glow(c, p.x, p.y, 6 + 12 * f, 0.5 * f * f, "150,225,255");
      }
    }
  }
  // 标题扫光
  function titleSweep(c, r, period, delay) {
    var ph = ((T + delay) % period) / 2.2;
    if (ph > 1) return;
    var cx = r[0] - 250 + (r[2] - r[0] + 500) * ph, cy = (r[1] + r[3]) / 2;
    ellipseGlow(c, cx, cy, 170, (r[3] - r[1]) * 0.55, 0, 0.22 * Math.sin(Math.PI * ph), "170,230,255");
  }
  // 太阳光晕与光芒
  function sunFlare(c, x, y) {
    var pulse = 0.5 + 0.5 * Math.sin(T * 1.3);
    glow(c, x, y, 230, 0.08 + 0.07 * pulse, "255,235,200");
    glow(c, x, y, 70, 0.12 + 0.1 * pulse, "255,250,235");
    ellipseGlow(c, x, y, 520, 9, -0.06, 0.12 + 0.08 * pulse, "200,230,255");
    c.save(); c.translate(x, y); c.rotate(T * 0.12);
    for (var i = 0; i < 6; i++) {
      c.rotate(TAU / 6);
      var lg = c.createLinearGradient(0, 0, 260, 0);
      lg.addColorStop(0, "rgba(255,245,225," + (0.12 + 0.06 * pulse) + ")");
      lg.addColorStop(1, "rgba(255,245,225,0)");
      c.strokeStyle = lg; c.lineWidth = 3;
      c.beginPath(); c.moveTo(20, 0); c.lineTo(260, 0); c.stroke();
    }
    c.restore();
  }
  // 从卫星射向地面的扇形波
  function waveArcs(c, x, y, ang, span, rMin, rMax, n, speed, width, maxA) {
    for (var w = 0; w < n; w++) {
      var ph = ((T * speed + w / n) % 1);
      var rad = rMin + ph * (rMax - rMin);
      var al = maxA * Math.sin(Math.PI * ph);
      c.strokeStyle = "rgba(90,190,255," + (al * 0.3) + ")";
      c.lineWidth = width * 3.5;
      c.beginPath(); c.arc(x, y, rad, ang - span, ang + span); c.stroke();
      c.strokeStyle = "rgba(160,230,255," + al + ")";
      c.lineWidth = width;
      c.beginPath(); c.arc(x, y, rad, ang - span, ang + span); c.stroke();
    }
  }
  // 地面足印（成像/扫描区域）
  function footprint(c, x, y, rx, ry, rot, pulse) {
    ellipseGlow(c, x, y, rx * 1.15, ry * 1.15, rot, 0.16 + 0.16 * pulse, "110,210,255");
    c.save(); c.translate(x, y); c.rotate(rot);
    c.strokeStyle = "rgba(160,230,255," + (0.35 + 0.3 * pulse) + ")"; c.lineWidth = 3.5;
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.stroke();
    var sx = Math.sin(T * 1.6) * rx * 0.92;
    var sy = ry * Math.sqrt(Math.max(0, 1 - (sx * sx) / (rx * rx)));
    c.strokeStyle = "rgba(200,240,255,0.55)"; c.lineWidth = 3;
    c.beginPath(); c.moveTo(sx, -sy); c.lineTo(sx, sy); c.stroke();
    c.restore();
  }

  /* ================= 场景：首页 ================= */
  var EARTH = { x: 1275, y: 695, r: 485 };
  var RINGS = [{ x: 1280, y: 700, rx: 560, ry: 590 }, { x: 1286, y: 703, rx: 588, ry: 612 }];
  var COMETS = [
    { ring: 0, a: 0.0, v: 0.22 }, { ring: 0, a: 2.1, v: 0.22 }, { ring: 0, a: 4.2, v: 0.22 },
    { ring: 1, a: 1.0, v: -0.16 }, { ring: 1, a: 4.1, v: -0.16 }
  ];
  var EMITTERS = [{ x: 1437, y: 630, d: 1.3 }, { x: 1098, y: 1158, d: 2.6 }, { x: 1345, y: 165, d: 0.6 }];
  var HOME_LABELS = [[820, 15, 1220, 120], [1565, 78, 1970, 185], [997, 452, 1397, 565], [1762, 1025, 2200, 1140], [662, 1228, 1155, 1340], [1432, 1320, 1845, 1435], [362, 225, 815, 340], [1808, 510, 2205, 625], [297, 628, 695, 745], [345, 1072, 830, 1178]];
  function nearEarth(x, y, r) { var dx = x - EARTH.x, dy = y - EARTH.y; return dx * dx + dy * dy < r * r; }
  function onLabel(x, y) { for (var i = 0; i < HOME_LABELS.length; i++) if (inRect(x, y, HOME_LABELS[i], 10)) return true; return false; }

  var home = {
    stars: points(110, function (x, y) { return !nearEarth(x, y, 650) && !onLabel(x, y); }),
    dust: new Dust(70, function (x, y) { return nearEarth(x, y, 640) || onLabel(x, y); }, 14, 5),
    meteors: new Meteors([[80, 30, 600, 380], [1900, 20, 2500, 360], [2000, 380, 2500, 600]], [2.5, 5]),
    nebula: [
      { x: 2250, y: 640, rx: 260, ry: 90, rot: -0.55, rgb: "60,130,255", p: 0 },
      { x: 2420, y: 470, rx: 230, ry: 80, rot: -0.6, rgb: "120,110,255", p: 2 },
      { x: 2530, y: 340, rx: 200, ry: 70, rot: -0.6, rgb: "70,160,255", p: 4 },
      { x: 360, y: 250, rx: 280, ry: 110, rot: -0.5, rgb: "110,100,230", p: 1 }
    ],
    warp: null,
    draw: function (c, dt) {
      // 星云缓缓流动
      for (var n = 0; n < this.nebula.length; n++) {
        var nb = this.nebula[n];
        var br = 0.5 + 0.5 * Math.sin(T * 0.35 + nb.p);
        ellipseGlow(c, nb.x + 30 * Math.sin(T * 0.12 + nb.p), nb.y + 16 * Math.cos(T * 0.1 + nb.p), nb.rx, nb.ry, nb.rot, 0.04 + 0.07 * br, nb.rgb);
      }
      // 银河旋转
      var gx = 309, gy = 188;
      for (var arm = 0; arm < 3; arm++) {
        ellipseGlow(c, gx, gy, 115, 34, -0.45 + T * 0.08 + arm * 1.05, 0.06 + 0.03 * Math.sin(T * 0.8 + arm), "170,160,255");
      }
      glow(c, gx, gy, 38, 0.18 + 0.1 * Math.sin(T * 1.2), "235,230,255");
      // 月亮微光
      glow(c, 2469, 704, 140, 0.05 + 0.04 * Math.sin(T * 0.7), "160,190,255");
      // 星光与星尘
      twinkle(c, this.stars, "220,240,255", 0.5);
      this.dust.draw(c, dt);
      // 地球大气呼吸光晕
      var breath = 0.5 + 0.5 * Math.sin(T * 1.1);
      var hg = c.createRadialGradient(EARTH.x, EARTH.y, EARTH.r * 0.92, EARTH.x, EARTH.y, EARTH.r * 1.16);
      hg.addColorStop(0, "rgba(60,160,255,0)");
      hg.addColorStop(0.35, "rgba(80,185,255," + (0.07 + 0.1 * breath) + ")");
      hg.addColorStop(1, "rgba(40,120,255,0)");
      c.fillStyle = hg;
      c.beginPath(); c.arc(EARTH.x, EARTH.y, EARTH.r * 1.16, 0, TAU); c.fill();
      // 地球表面雷达扫描
      c.save();
      c.beginPath(); c.arc(EARTH.x, EARTH.y, EARTH.r - 4, 0, TAU); c.clip();
      var sa = T * 0.55, span = 1.1;
      if (c.createConicGradient) {
        var fr = span / TAU;
        var cg = c.createConicGradient(sa, EARTH.x, EARTH.y);
        cg.addColorStop(0, "rgba(90,200,255,0.14)");
        cg.addColorStop(0.004, "rgba(90,200,255,0)");
        cg.addColorStop(1 - fr, "rgba(90,200,255,0)");
        cg.addColorStop(1 - fr * 0.45, "rgba(90,200,255,0.035)");
        cg.addColorStop(1, "rgba(90,200,255,0.14)");
        c.fillStyle = cg;
        c.fillRect(EARTH.x - EARTH.r, EARTH.y - EARTH.r, EARTH.r * 2, EARTH.r * 2);
      }
      c.strokeStyle = "rgba(170,230,255,0.22)"; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(EARTH.x, EARTH.y);
      c.lineTo(EARTH.x + EARTH.r * Math.cos(sa), EARTH.y + EARTH.r * Math.sin(sa)); c.stroke();
      c.restore();
      // 轨道光点
      for (var j = 0; j < COMETS.length; j++) {
        var cm = COMETS[j], R = RINGS[cm.ring];
        var a = cm.a + cm.v * T, dir = cm.v > 0 ? 1 : -1;
        for (var q = 26; q >= 0; q--) {
          var aa = a - dir * q * 0.012, f = 1 - q / 26, rr = 3 + 7 * f;
          glow(c, R.x + R.rx * Math.cos(aa), R.y + R.ry * Math.sin(aa), rr * 2.2, 0.55 * f * f, "200,240,255");
        }
      }
      // 卫星信号波 + 地面天线信号
      for (var e = 0; e < EMITTERS.length; e++) {
        var em = EMITTERS[e];
        var ang = Math.atan2(EARTH.y - em.y, EARTH.x - em.x);
        var saveT = T; T = saveT + em.d;
        waveArcs(c, em.x, em.y, ang, 0.55, 20, 140, 3, 0.6, 3, 0.35);
        T = saveT;
      }
      waveArcs(c, 2398, 995, Math.atan2(EARTH.y - 995, EARTH.x - 2398), 0.4, 40, 260, 3, 0.45, 3.5, 0.3);
      glow(c, 2398, 995, 30, 0.25 + 0.2 * Math.sin(T * 3), "170,230,255");
      // 流星
      this.meteors.draw(c, dt);
      // 跳转时的跃迁光线
      if (this.warp) {
        var wp = (now() - this.warp.t0) / 750;
        if (wp >= 1) this.warp = null;
        else {
          var W = this.warp;
          for (var k = 0; k < W.rays.length; k++) {
            var ry = W.rays[k];
            var r0 = ry.r0 + wp * wp * 1900 * ry.v, r1 = r0 + 40 + wp * 520 * ry.v;
            var x0 = W.x + Math.cos(ry.a) * r0, y0 = W.y + Math.sin(ry.a) * r0;
            var x1 = W.x + Math.cos(ry.a) * r1, y1 = W.y + Math.sin(ry.a) * r1;
            var lg = c.createLinearGradient(x0, y0, x1, y1);
            lg.addColorStop(0, "rgba(150,220,255,0)");
            lg.addColorStop(1, "rgba(210,240,255," + (0.6 * Math.sin(Math.PI * wp)) + ")");
            c.strokeStyle = lg; c.lineWidth = ry.w;
            c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
          }
          glow(c, W.x, W.y, 120 + 600 * wp, 0.35 * Math.sin(Math.PI * wp), "160,225,255");
        }
      }
    }
  };

  /* ================= 场景：详情页（光学 / 雷达） ================= */
  var SKY_LINE = [[0, 1100], [900, 560], [1500, 330], [2576, 120]];     // 此线以上一定是太空
  var GROUND_LINE = [[600, 1449], [1100, 1000], [1700, 750], [2576, 560]]; // 此线以下一定是地面
  function lineY(L, x) {
    if (x <= L[0][0]) return L[0][1];
    for (var i = 0; i < L.length - 1; i++) {
      if (x <= L[i + 1][0]) return L[i][1] + (L[i + 1][1] - L[i][1]) * (x - L[i][0]) / (L[i + 1][0] - L[i][0]);
    }
    return L[L.length - 1][1];
  }
  function makeDetail(cfg) {
    var blocked = function (x, y, pad) {
      if (inRect(x, y, cfg.title, pad) || inRect(x, y, cfg.left, pad) || inRect(x, y, cfg.right, pad) || inRect(x, y, cfg.sat, pad)) return true;
      return false;
    };
    var sc = {
      stars: points(70, function (x, y) { return y < lineY(SKY_LINE, x) - 30 && !blocked(x, y, 30); }),
      lights: points(80, function (x, y) {
        var dx = x - cfg.sun[0], dy = y - cfg.sun[1];
        return x < 2560 && y < 1440 && y > lineY(GROUND_LINE, x) + 30 && !blocked(x, y, 20) && dx * dx + dy * dy > 200 * 200;
      }),
      dust: new Dust(45, function (x, y) { return blocked(x, y, 15); }, 6, -12),
      meteors: new Meteors([[1500, 20, 2300, 200], [300, 20, 1000, 120]], [4, 8]),
      frames: [framePath(cfg.left, 34), framePath(cfg.right, 34)],
      draw: function (c, dt) {
        twinkle(c, this.stars, "220,240,255", 0.45);
        twinkle(c, this.lights, "210,235,255", 0.55, 2.4);
        this.dust.draw(c, dt);
        sunFlare(c, cfg.sun[0], cfg.sun[1]);
        cfg.special(c);
        runLights(c, this.frames[0], 230, [0, 0.5]);
        runLights(c, this.frames[1], -230, [0.25, 0.75]);
        titleSweep(c, cfg.title, 4.5, 0);
        this.meteors.draw(c, dt);
      }
    };
    return sc;
  }
  var optical = makeDetail({
    title: [110, 195, 1400, 300], left: [118, 412, 845, 1112], right: [1768, 412, 2500, 1112],
    sat: [880, 570, 1760, 910], sun: [1555, 1215],
    special: function (c) {
      // 光学成像光束：镜头 → 地面成像区
      var L = { x: 1335, y: 880 }, F = { x: 1150, y: 1320 };
      var ang = Math.atan2(F.y - L.y, F.x - L.x), px = -Math.sin(ang), py = Math.cos(ang);
      var pulse = 0.5 + 0.5 * Math.sin(T * 2.1);
      var lg = c.createLinearGradient(L.x, L.y, F.x, F.y);
      lg.addColorStop(0, "rgba(150,225,255," + (0.32 + 0.12 * pulse) + ")");
      lg.addColorStop(1, "rgba(110,200,255,0.08)");
      c.fillStyle = lg;
      c.beginPath(); c.moveTo(L.x + px * 22, L.y + py * 22); c.lineTo(L.x - px * 22, L.y - py * 22);
      c.lineTo(F.x - px * 170, F.y - py * 170); c.lineTo(F.x + px * 170, F.y + py * 170); c.closePath(); c.fill();
      footprint(c, F.x, F.y, 175, 45, 0, pulse);
      // 光束中向下流动的扫描线
      for (var k = 0; k < 3; k++) {
        var u = ((T * 0.5 + k / 3) % 1);
        var cx = L.x + (F.x - L.x) * u, cy = L.y + (F.y - L.y) * u, hw = 22 + 148 * u;
        c.strokeStyle = "rgba(200,240,255," + (0.5 * Math.sin(Math.PI * u)) + ")"; c.lineWidth = 3;
        c.beginPath(); c.moveTo(cx + px * hw, cy + py * hw); c.lineTo(cx - px * hw, cy - py * hw); c.stroke();
      }
      glow(c, 1335, 840, 70, 0.12 + 0.12 * pulse, "180,235,255"); // 镜头反光
      // 周期性“拍摄”闪光
      var shot = (T % 3.2) / 3.2;
      if (shot < 0.12) glow(c, F.x, F.y, 260, 0.25 * Math.sin(Math.PI * shot / 0.12), "200,240,255");
    }
  });
  var radar = makeDetail({
    title: [110, 105, 1400, 215], left: [118, 357, 845, 1182], right: [1772, 357, 2500, 1185],
    sat: [870, 430, 1720, 1060], sun: [1560, 1215],
    special: function (c) {
      // 雷达波：天线 → 地面扫描区
      var A = { x: 1300, y: 880 }, G = { x: 985, y: 1310 };
      var ang = Math.atan2(G.y - A.y, G.x - A.x), dist = Math.hypot(G.x - A.x, G.y - A.y);
      waveArcs(c, A.x, A.y, ang, 0.33, 70, dist, 5, 0.42, 6, 0.75);
      var hit = 0.5 + 0.5 * Math.sin(T * 0.42 * TAU);
      footprint(c, G.x, G.y, 200, 55, 0, hit);
      // 天线表面流动的微光
      var ph = (T * 0.35) % 1;
      var ax = 1520 - ph * 560, ay = 715 + ph * 310;
      ellipseGlow(c, ax, ay, 120, 40, -0.5, 0.16 * Math.sin(Math.PI * ph), "190,235,255");
    }
  });

  var SCENES = { home: home, optical: optical, radar: radar };

  /* ================= 动画循环 ================= */
  var T = 0, raf = 0, last = 0, drawing = {};
  var canvases = {};
  Array.prototype.forEach.call(document.querySelectorAll("canvas.fx"), function (cv) {
    canvases[cv.getAttribute("data-scene")] = { el: cv, ctx: cv.getContext("2d"), scale: 1 };
  });
  function now() { return (window.performance && performance.now()) || Date.now(); }
  function resize(name) {
    var cv = canvases[name]; if (!cv) return;
    var w = cv.el.parentNode.offsetWidth, h = cv.el.parentNode.offsetHeight;
    if (!w) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var pw = Math.min(Math.round(w * dpr), 3840), ph = Math.round(pw * h / w);
    if (cv.el.width !== pw || cv.el.height !== ph) { cv.el.width = pw; cv.el.height = ph; }
    cv.scale = pw / BW;
  }
  function render(name, dt) {
    var cv = canvases[name], c = cv.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.el.width, cv.el.height);
    c.setTransform(cv.scale, 0, 0, cv.scale, 0, 0);
    c.globalCompositeOperation = "lighter";
    SCENES[name].draw(c, dt);
    c.globalCompositeOperation = "source-over";
  }
  function loop(t) {
    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0.016;
    last = t; T += dt;
    for (var k in drawing) if (drawing[k]) render(k, dt);
    raf = requestAnimationFrame(loop);
  }
  function setDrawing(list) {
    drawing = {};
    list.forEach(function (n) { if (n) { drawing[n] = true; resize(n); } });
    if (reduce) { for (var k in drawing) render(k, 0); return; }
    if (!raf && !document.hidden) { last = 0; raf = requestAnimationFrame(loop); }
  }
  function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  window.addEventListener("resize", function () { for (var k in drawing) { resize(k); if (reduce) render(k, 0); } });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopLoop(); else setDrawing(Object.keys(drawing));
  });

  /* ================= 页面切换 ================= */
  var VIEWS = ["home", "optical", "radar"];
  var current = null, cleanupTimer = 0, pendingOrigin = null;
  function $(id) { return document.getElementById(id); }

  function cleanup() {
    VIEWS.forEach(function (v) { $(v).classList.remove("leaving", "entering", "from-home", "to-home", "intro"); });
    setDrawing([current]);
  }
  function show(name, origin, intro) {
    if (VIEWS.indexOf(name) < 0) name = "home";
    if (name === current) return;
    var prev = current; current = name;
    clearTimeout(cleanupTimer);
    VIEWS.forEach(function (v) { $(v).classList.remove("active", "leaving", "entering", "from-home", "to-home", "intro"); });
    var next = $(name);
    next.classList.add("active");

    if (reduce) { setDrawing([name]); return; }

    if (intro) {
      next.classList.add("entering", "intro");
    } else if (prev) {
      var pv = $(prev);
      var mode = name === "home" ? "to-home" : "from-home";
      var o = origin || { x: 50, y: 50 };
      [pv, next].forEach(function (v) {
        var st = v.querySelector(".stage");
        st.style.setProperty("--ox", o.x + "%");
        st.style.setProperty("--oy", o.y + "%");
        st.style.setProperty("--zx", (-(o.x - 50) * 0.1) + "%");
        st.style.setProperty("--zy", (-(o.y - 50) * 0.1) + "%");
      });
      void next.offsetWidth; // 重新触发动画
      pv.classList.add("leaving", mode);
      next.classList.add("entering", mode);
    }
    setDrawing([name, prev]);
    cleanupTimer = setTimeout(cleanup, 1700);
  }

  function go(name, origin) {
    var target = name === "home" ? "" : name;
    pendingOrigin = origin || null;
    if (location.hash.slice(1) === target) { show(name, origin); return; }
    if (target) location.hash = target;
    else {
      try { history.pushState(null, "", location.pathname + location.search); } catch (e) {}
      show("home");
    }
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go]");
    if (!el) return;
    e.preventDefault();
    var origin = null;
    if (el.classList.contains("hot")) {
      origin = {
        x: parseFloat(el.style.left) + parseFloat(el.style.width) / 2,
        y: parseFloat(el.style.top) + parseFloat(el.style.height) / 2
      };
    }
    go(el.getAttribute("data-go"), origin);
  });
  function onNav() { var o = pendingOrigin; pendingOrigin = null; show(location.hash.slice(1), o); }
  window.addEventListener("hashchange", onNav);
  window.addEventListener("popstate", onNav);

  show(location.hash.slice(1), null, true);
})();
</script>
</body>
